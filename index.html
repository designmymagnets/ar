<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design My Magnets</title>
<meta name="theme-color" content="#111111">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  :root { --red: #d62700; }
  html, body { margin: 0; height: 100%; background: #111; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #ui { position: fixed; inset: 0; z-index: 10; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 20px); }
  .pill { pointer-events: auto; background: rgba(0,0,0,.6); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); border-radius: 999px; padding: 10px 18px; font-size: 15px; text-align: center; }
  #bottom { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button { pointer-events: auto; border: 0; border-radius: 999px; padding: 12px 18px; font-size: 15px;
    font-weight: 600; color: #fff; background: rgba(0,0,0,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  button.primary { background: var(--red); }
  .hidden { display: none !important; }
  #full { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; z-index: 20; }
  #closeFull { position: fixed; top: calc(env(safe-area-inset-top) + 12px); right: 12px; z-index: 21; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; z-index: 30; background: #111; font-size: 17px; line-height: 1.4; }
  #brand { font-size: 12px; opacity: .7; margin-top: 8px; pointer-events: auto; color: #fff; text-decoration: none; }
</style>
</head>
<body>

<div id="ui">
  <div id="hint" class="pill">Point your camera at the magnet</div>
  <div style="display:flex;flex-direction:column;align-items:center;">
    <div id="bottom">
      <button id="soundBtn" class="primary hidden">Tap for sound</button>
      <button id="fullBtn">Watch full screen</button>
    </div>
    <a id="brand" href="https://designmymagnets.ca">designmymagnets.ca</a>
  </div>
</div>

<video id="full" class="hidden" playsinline webkit-playsinline controls></video>
<button id="closeFull" class="hidden">Close</button>
<div id="msg" class="hidden"></div>

<div id="stage"></div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const id = (params.get('m') || '').replace(/[^a-zA-Z0-9_-]/g, '');
  const $ = (s) => document.getElementById(s);
  const base = 'm/' + id + '/';
  const videoUrl = base + 'video.mov';
  let arVideo = null;

  function showMsg(text) { const m = $('msg'); m.textContent = text; m.classList.remove('hidden'); }

  function playFull(autoplay) {
    if (arVideo) arVideo.pause();
    const v = $('full');
    if (!v.src) v.src = videoUrl;
    v.classList.remove('hidden');
    $('closeFull').classList.remove('hidden');
    if (autoplay !== false) { v.play().catch(() => {}); }
  }

  $('fullBtn').onclick = () => { const f = $('full'); f.muted = false; playFull(); };
  $('closeFull').onclick = () => {
    const f = $('full'); f.pause();
    f.classList.add('hidden'); $('closeFull').classList.add('hidden');
  };
  $('soundBtn').onclick = () => {
    if (!arVideo) return;
    arVideo.muted = false; arVideo.play().catch(() => {});
    $('soundBtn').classList.add('hidden');
  };

  async function init() {
    if (!id) { showMsg('This link is missing its magnet code. Try scanning the QR again.'); return; }

    let info = { ratio: 90 / 65 }; // default: 65x90 portrait rectangle
    try {
      const r = await fetch(base + 'info.json', { cache: 'no-cache' });
      if (r.ok) info = Object.assign(info, await r.json());
    } catch (e) {}

    // Check the video exists before opening the camera
    try {
      const h = await fetch(videoUrl, { method: 'HEAD' });
      if (!h.ok) { showMsg("We couldn't find this video. Contact hi@designmymagnets.ca"); return; }
    } catch (e) {}

    // No camera support: go straight to full screen
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { playFull(false); return; }

    const ratio = Number(info.ratio) || 90 / 65;
    $('stage').innerHTML =
      '<a-scene mindar-image="imageTargetSrc: ' + base + 'target.mind; uiScanning: no; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"' +
      ' color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true"' +
      ' vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded' +
      ' style="position:fixed;inset:0;width:100%;height:100%;">' +
        '<a-assets timeout="5000">' +
          '<video id="arvid" src="' + videoUrl + '" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>' +
        '</a-assets>' +
        '<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>' +
        '<a-entity id="target" mindar-image-target="targetIndex: 0">' +
          '<a-video src="#arvid" width="1" height="' + ratio + '" position="0 0 0"></a-video>' +
        '</a-entity>' +
      '</a-scene>';

    const scene = document.querySelector('a-scene');
    arVideo = document.getElementById('arvid');
    const target = document.getElementById('target');

    scene.addEventListener('arError', () => {
      $('hint').textContent = "Camera isn't available, playing full screen";
      playFull(false);
    });

    target.addEventListener('targetFound', () => {
      $('hint').classList.add('hidden');
      arVideo.play().catch(() => {});
      if (arVideo.muted) $('soundBtn').classList.remove('hidden');
    });
    target.addEventListener('targetLost', () => {
      arVideo.pause();
      $('hint').classList.remove('hidden');
      $('hint').textContent = 'Point your camera at the magnet';
    });
  }

  init();
})();
</script>
</body>
</html>
