<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design My Magnets</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html { background: #111; }
  body { margin: 0; background: none; color: #fff; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .pill { background: rgba(0,0,0,.6); border-radius: 999px; padding: 10px 18px; font-size: 15px; }
  #hint { position: fixed; z-index: 10; top: 16px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
  #bottom { position: fixed; z-index: 10; left: 0; right: 0; bottom: 24px;
    display: flex; justify-content: center; gap: 10px; }
  button { border: 0; border-radius: 999px; padding: 12px 18px; font-size: 15px; font-weight: 600;
    color: #fff; background: rgba(0,0,0,.6); }
  button.primary { background: #d62700; }
  .hidden { display: none !important; }
  #full { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; z-index: 20; }
  #closeFull { position: fixed; top: 12px; right: 12px; z-index: 21; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; z-index: 30; background: #111; font-size: 17px; }
  #start { position: fixed; inset: 0; z-index: 25; background: #111; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; font-size: 15px; opacity: .95; }
  #start button { font-size: 18px; padding: 16px 28px; }
</style>
</head>
<body>

<div id="hint" class="pill">Point your camera at the magnet</div>
<div id="bottom">
  <button id="soundBtn" class="primary hidden">Tap for sound</button>
  <button id="fullBtn">Watch full screen</button>
</div>
<video id="full" class="hidden" playsinline webkit-playsinline controls></video>
<button id="closeFull" class="hidden">Close</button>
<div id="msg" class="hidden"></div>
<div id="start" class="hidden">
  <button class="primary">Tap to start</button>
  <p>Then point your camera at the magnet</p>
</div>

<script>
(function () {
  const id = (new URLSearchParams(location.search).get('m') || '').replace(/[^a-zA-Z0-9_-]/g, '');
  const $ = (s) => document.getElementById(s);
  const base = 'm/' + id + '/';
  let videoUrl = base + 'video.mp4';
  let arVideo = null;

  function showMsg(t) { $('msg').textContent = t; $('msg').classList.remove('hidden'); }
  function playFull() {
    if (arVideo) arVideo.pause();
    const v = $('full');
    if (!v.src) v.src = videoUrl;
    v.classList.remove('hidden'); $('closeFull').classList.remove('hidden');
    v.muted = false; v.play().catch(() => {});
  }
  $('fullBtn').onclick = playFull;
  $('closeFull').onclick = () => { $('full').pause(); $('full').classList.add('hidden'); $('closeFull').classList.add('hidden'); };
  $('soundBtn').onclick = () => { if (arVideo) { arVideo.muted = false; arVideo.play(); } $('soundBtn').classList.add('hidden'); };

  async function init() {
    if (!id) { showMsg('This link is missing its magnet code.'); return; }

    let ratio = 90 / 65;
    try { const r = await fetch(base + 'info.json'); if (r.ok) ratio = Number((await r.json()).ratio) || ratio; } catch (e) {}

    const names = ['video.mp4', 'video.MP4', 'video.mov', 'video.MOV', 'Video.mp4', 'Video.MP4', 'Video.mov', 'Video.MOV'];
    let found = false;
    for (const n of names) {
      try { const h = await fetch(base + n, { method: 'HEAD' }); if (h.ok) { videoUrl = base + n; found = true; break; } } catch (e) {}
    }
    if (!found) { showMsg("We couldn't find this video. Contact hi@designmymagnets.ca"); return; }

    const wrap = document.createElement('div');
    wrap.innerHTML =
      '<a-scene mindar-image="imageTargetSrc: ' + base + 'target.mind; uiScanning: no; uiLoading: no; uiError: no; autoStart: false; filterMinCF: 0.0001; filterBeta: 0.001"' +
      ' color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"' +
      ' device-orientation-permission-ui="enabled: false" loading-screen="enabled: false">' +
        '<a-assets><video id="arvid" src="' + videoUrl + '" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video></a-assets>' +
        '<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>' +
        '<a-entity id="target" mindar-image-target="targetIndex: 0">' +
          '<a-video src="#arvid" width="1" height="' + ratio + '" position="0 0 0"></a-video>' +
        '</a-entity>' +
      '</a-scene>';
    document.body.appendChild(wrap.firstChild);

    arVideo = $('arvid');
    const scene = document.querySelector('a-scene');

    $('start').classList.remove('hidden');
    $('start').onclick = () => {
      $('start').classList.add('hidden');
      arVideo.muted = false;
      arVideo.play().then(() => arVideo.pause()).catch(() => { arVideo.muted = true; });
      const sys = scene.systems['mindar-image-system'];
      const go = () => scene.systems['mindar-image-system'].start();
      if (scene.hasLoaded && sys) go(); else scene.addEventListener('loaded', go);
    };
    scene.addEventListener('arError', () => { $('hint').textContent = "Camera isn't available"; });
    $('target').addEventListener('targetFound', () => {
      $('hint').classList.add('hidden');
      arVideo.play().catch(() => {});
      if (arVideo.muted) $('soundBtn').classList.remove('hidden');
    });
    $('target').addEventListener('targetLost', () => { arVideo.pause(); $('hint').classList.remove('hidden'); });
  }
  init();
})();
</script>
</body>
</html>
